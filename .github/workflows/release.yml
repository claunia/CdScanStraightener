name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64 ]
        tool: [ CdScanStraightener, CdInlayStraightener ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish ${{ matrix.tool }}/${{ matrix.tool }}.csproj
          -c Release -r ${{ matrix.rid }}
          -o out/${{ matrix.tool }}

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="${GITHUB_SHA::7}"
          name="${{ matrix.tool }}-${version}-${{ matrix.rid }}"
          cd out
          case "${{ matrix.rid }}" in
            win-*) zip -qr "../$name.zip" ${{ matrix.tool }}; echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
            *)     tar -czf "../$name.tar.gz" ${{ matrix.tool }}; echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tool }}-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
